# Grafana Alloy: ships every pod's logs (and Kubernetes events) to Loki. Replaces Promtail (EOL March 2026).
# Runs as one Deployment reading logs through the Kubernetes API, so no host mounts are needed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.15.0
    helm:
      releaseName: alloy
      valuesObject:
        controller:
          type: deployment
          replicas: 1
        serviceMonitor: { enabled: true }
        alloy:
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          configMap:
            content: |
              // Every pod in the cluster, labelled so you can filter in Grafana:
              //   {namespace="strat1990", app="scoresheet"}
              discovery.kubernetes "pods" {
                role = "pod"
              }
              discovery.relabel "pods" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app"]
                  separator     = ""
                  target_label  = "app"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_node_name"]
                  target_label  = "node"
                }
              }
              loki.source.kubernetes "pods" {
                targets    = discovery.relabel.pods.output
                forward_to = [loki.process.drop_noise.receiver]
              }
              // Drop known-harmless noise before it reaches Loki. Scoped to the exact message and pod,
              // so every other kube-system log line is kept.
              loki.process "drop_noise" {
                // kube-apiserver logs this whenever a request is cancelled while it is opening an etcd
                // connection; benign on its own (a real etcd problem says "refused" or "deadline exceeded").
                stage.match {
                  selector = "{namespace=\"kube-system\", container=\"kube-apiserver\"}"
                  stage.drop {
                    expression          = `createTransport failed to connect to \{Addr: "127\.0\.0\.1:2379".*operation was canceled`
                    drop_counter_reason = "apiserver_etcd_dial_canceled"
                  }
                }
                // Informational (I...) API-server warnings that client libraries relay into their own logs:
                // Calico's "unknown field \"status\"" and the v1 Endpoints deprecation notice. Not actionable
                // here; they go away when the component that triggers them is upgraded.
                stage.drop {
                  expression          = `^I\d{4} .*warnings\.go:\d+\] "Warning: (unknown field \\"status\\"|v1 Endpoints is deprecated in v1\.33\+)`
                  drop_counter_reason = "relayed_api_deprecation_info"
                }
                forward_to = [loki.write.default.receiver]
              }
              // Kubernetes events (pod restarts, image pulls, scheduling problems).
              loki.source.kubernetes_events "events" {
                job_name   = "integrations/kubernetes/eventhandler"
                log_format = "logfmt"
                forward_to = [loki.write.default.receiver]
              }
              loki.write "default" {
                endpoint {
                  url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
                }
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
