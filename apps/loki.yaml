# Loki: log storage, single process on a Longhorn volume, 14-day retention.
# The chart moved to the Grafana community repo in March 2026.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: 21.0.0
    helm:
      releaseName: loki
      valuesObject:
        deploymentMode: Monolithic
        loki:
          auth_enabled: false            # single tenant; only reachable inside the cluster
          commonConfig: { replication_factor: 1 }
          storage: { type: filesystem }
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index: { prefix: loki_index_, period: 24h }
          limits_config:
            retention_period: 336h       # 14 days
          compactor:
            retention_enabled: true
            delete_request_store: filesystem
        singleBinary:
          replicas: 1
          persistence: { enabled: true, size: 20Gi }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
        # Small homelab footprint: no memcached caches, canary, test pod or nginx gateway.
        chunksCache: { enabled: false }
        resultsCache: { enabled: false }
        lokiCanary: { enabled: false }
        test: { enabled: false }
        gateway: { enabled: false }
        backend: { replicas: 0 }
        read: { replicas: 0 }
        write: { replicas: 0 }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
