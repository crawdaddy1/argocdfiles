# Puts the Argo CD UI on the tailnet as https://argocd once the Tailscale operator is running.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-tailnet
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/crawdaddy1/argocdfiles.git
    targetRevision: main
    path: platform/argocd-tailnet
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
