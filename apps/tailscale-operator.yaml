# Tailscale Kubernetes operator: puts annotated Services on the tailnet
# (tailscale.com/expose: "true" + tailscale.com/hostname: <name>).
# Needs the operator-oauth secret — committed sealed in platform/tailscale-operator/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    # Let the API server compute diffs: Argo CD's built-in schema predates fields added in k8s 1.36
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://pkgs.tailscale.com/helmcharts
      chart: tailscale-operator
      targetRevision: 1.104.7            # latest published operator chart (operator and proxies default to v1.104.7)
      helm:
        releaseName: tailscale-operator
        valuesObject:
          operatorConfig:
            hostname: k8s-operator       # name of the operator on your tailnet
          # No image pins: the chart's own version sets both images. If a patch release ships images
          # before a chart, pin operatorConfig.image.tag and proxyConfig.image.tag here (test-pull first).
          # oauth.clientId / clientSecret deliberately left empty: the chart then uses the
          # existing "operator-oauth" Secret, which comes from the SealedSecret below.
    - repoURL: https://github.com/crawdaddy1/argocdfiles.git
      targetRevision: main
      path: platform/tailscale-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
