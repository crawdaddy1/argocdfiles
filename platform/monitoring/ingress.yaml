# Grafana and Prometheus on the tailnet with Let's Encrypt certificates from Tailscale.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-tailnet
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: kube-prometheus-stack-grafana
      port: { number: 80 }
  tls:
    - hosts: [grafana]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-tailnet
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: kube-prometheus-stack-prometheus
      port: { number: 9090 }
  tls:
    - hosts: [prometheus]
