# Longhorn dashboard on the tailnet at http://longhorn (needs the Tailscale operator).
# The dashboard has no login, so it's only reachable from your tailnet.
apiVersion: v1
kind: Service
metadata:
  name: longhorn-ui-tailnet
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: longhorn
spec:
  selector:
    app: longhorn-ui
  ports:
    - name: http
      port: 80
      targetPort: 8000
