# Argo CD UI on the tailnet at https://argocd (needs the Tailscale operator).
# argocd-server uses a self-signed certificate, so the browser will warn the first time.
apiVersion: v1
kind: Service
metadata:
  name: argocd-server-tailnet
  namespace: argocd
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: argocd
spec:
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
    - name: https
      port: 443
      targetPort: 8080
    - name: http
      port: 80
      targetPort: 8080
